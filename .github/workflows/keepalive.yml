name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *" # mỗi 10 phút
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: |
          echo "Workflow Keep Render Awake chạy vào lúc: $(date)"
          curl -s https://vl-deadline-bot.onrender.com/telegram/check > /dev/null
